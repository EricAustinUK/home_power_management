[package]
name = "home_assist_main"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "home_assist"
path = "src/main.rs"

[dependencies]
rppal = { version="0.22.1", features=["hal"] }
serde = { version="1.0", features=["derive"] }
either = "1.17.0"
url = "2.5.8"
thiserror = "2.0.20"
dotenvy = "0.15.7"
ureq = { version="3.4.0", features=["json"] }
rill-ml = { version="1.1.0", features=["serde"] }
time = { version = "0.3.55", features = ["macros", "local-offset", "formatting", "parsing"] }
postcard = { version="1.1.3", features=["alloc"] }
slint = {
    version = "1.17.1",
    default-features = false,
    features = [
        "std",
        "renderer-software",
        "compat-1-2"
    ]
}
embedded-graphics = "0.8.2"
st7735-lcd = "0.10.0"

[build-dependencies]
slint-build = "1.17.1"
